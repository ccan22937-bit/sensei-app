name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Fix Dependencies & Clean Hatalı Paketler
        run: |
          # Bulunan tüm build.gradle dosyalarından litertlm bağımlılığını sil
          find . -name "build.gradle*" -exec sed -i '/litertlm/d' {} +
          
          # android dizinini kontrol et ve gradlew oluştur
          if [ -d "android" ]; then
            cd android
          fi
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Android APK
        run: |
          if [ -d "android" ]; then
            cd android
          fi
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sensei-Debug-APK
          path: "**/*.apk"
          
