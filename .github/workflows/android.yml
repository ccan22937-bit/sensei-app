name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clean Old Android & Install Capacitor
        run: |
          rm -rf android
          npm ci || npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev

      - name: Build Web App & Assets
        run: |
          npm run build || npx vite build
          mkdir -p www
          cp -r dist/* www/ || true

      - name: Init Capacitor & Add Android Platform
        run: |
          npx cap init "Sensei" "com.sensei.bingelingo" --web-dir "www" || true
          npx cap add android
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sensei-Debug-APK
          path: "**/*.apk"
          
