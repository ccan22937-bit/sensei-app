name: Build Sensei Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install npm dependencies
        run: npm install

      - name: Install Capacitor packages
        run: |
          npm install --save-dev @capacitor/core @capacitor/cli @capacitor/android

      - name: Build web application
        run: npm run build

      - name: Prepare Capacitor web assets
        run: |
          mkdir -p www
          rm -rf www/*
          cp -r dist/* www/

      - name: Add Android platform if missing
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android platform already exists. Skipping npx cap add android."
          fi

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Sensei Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Sensei-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
