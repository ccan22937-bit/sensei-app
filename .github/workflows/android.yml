name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Find and Build Gradle
      run: |
        GRADLE_PATH=$(find . -name "gradlew" -type f | head -n 1)
        if [ -n "$GRADLE_PATH" ]; then
          DIR=$(dirname "$GRADLE_PATH")
          echo "Gradle yolu bulundu: $DIR"
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
        else
          echo "gradlew bulunamadi!"
          exit 1
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/*.apk"
        
